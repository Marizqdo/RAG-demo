[project]
name = "rag-demo"
version = "0.1.0"
description = "RAG demo with LangChain, Ollama, ChromaDB and Chainlit"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "chainlit>=1.3.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.27.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_demo"]

[tool.uv]
dev-dependencies = [
    "hatchling>=1.29.0",
]
